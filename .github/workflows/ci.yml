name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Byte-compile all Python
        run: python -m compileall -q agent app etl ui airflow

      - name: Validate docker compose
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Build API and UI images
        run: docker compose build api ui
